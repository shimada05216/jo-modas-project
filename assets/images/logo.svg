<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 78" role="img" aria-label="Jo Modas - Moda Feminina">
  <title>Jo Modas</title>
  <!--
    Identidade preto + dourado.

    O preto carrega a marca; o dourado aparece so em dois lugares (o anel
    do monograma e a assinatura), para nao virar um logo dourado.

    Os textos ficam centrados de proposito: se a Georgia nao existir na
    maquina, a fonte substituta cresce para os dois lados e continua
    alinhada, em vez de vazar para fora do desenho.

    Versao para fundo claro. Para fundo escuro, ver logo-light.svg.
  -->
  <g fill="none" fill-rule="evenodd">
    <!-- Monograma -->
    <circle cx="38" cy="39" r="25" stroke="#C6A15B" stroke-width="1.6"/>
    <text x="38" y="48" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', Times, serif"
          font-size="25" letter-spacing="0.5" fill="#111111">JM</text>

    <!-- Marca -->
    <text x="188" y="40" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', Times, serif"
          font-size="29" letter-spacing="2.5" fill="#111111">JO MODAS</text>

    <!-- Assinatura -->
    <text x="188" y="62" text-anchor="middle"
          font-family="'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="9" letter-spacing="4.5" fill="#C6A15B">MODA FEMININA</text>
  </g>
</svg>
